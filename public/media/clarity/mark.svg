<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Clarity mark · vector redraw of the app icon. The <g id="mag"> group is the
       magnifier (ring, handle, glass) and may rotate independently of the square. -->
  <defs>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b4c3"/><stop offset=".45" stop-color="#3a4553"/><stop offset="1" stop-color="#121b26"/></linearGradient>
    <radialGradient id="lens" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#cff8e7"/><stop offset=".55" stop-color="#589da1"/><stop offset="1" stop-color="#2f6b72"/></radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fe3cf"/><stop offset="1" stop-color="#5cc2ad"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#sq)"/>
  <g id="mag">
    <circle cx="50" cy="49" r="29" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-dasharray="132 60" transform="rotate(38 50 49)"/>
    <line x1="66" y1="64" x2="80" y2="78" stroke="url(#handle)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="48" r="18.5" fill="url(#lens)" stroke="#8ddccb" stroke-width="1.6"/>
    <ellipse cx="45" cy="40" rx="5.5" ry="3" fill="rgba(255,255,255,0.7)" transform="rotate(-35 45 40)"/>
  </g>
</svg>

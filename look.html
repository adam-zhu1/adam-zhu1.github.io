<!doctype html>
<html lang="en" data-variant="a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=kihim@400&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500&display=swap" rel="stylesheet" />
    <title>Look study: screen one, three type directions</title>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>

    <!-- Study controls: not part of the design. -->
    <div class="study" role="group" aria-label="Type direction">
      <button class="study-btn" data-set="a" aria-pressed="true">1 Studio</button>
      <button class="study-btn" data-set="b" aria-pressed="false">2 Editorial</button>
      <button class="study-btn" data-set="c" aria-pressed="false">3 Geometric</button>
    </div>

    <main class="screen">
      <header class="mark">
        <span class="wordmark">Adam Zhu</span>
        <span class="place">Pittsburgh <time id="clock" datetime="">00:00:00</time></span>
      </header>

      <div class="statement">
        <h1 class="name">Adam Zhu</h1>
        <p class="line">
          <span class="fixed">I build things that</span><span class="rotator" aria-live="off">
            <span class="word is-on">look closely.</span>
            <span class="word">measure.</span>
            <span class="word">notice.</span>
            <span class="word">tell you what they saw.</span>
          </span>
        </p>
        <p class="sub">Statistics and machine learning at Carnegie Mellon.</p>
      </div>

      <nav class="links" aria-label="Links">
        <a href="https://github.com/adam-zhu1" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/adam-zhu-cmu/" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="mailto:adamzhu@andrew.cmu.edu">Email</a>
        <a href="/Adam-Zhu-Resume.pdf" target="_blank" rel="noreferrer">Resume</a>
        <a href="https://apps.apple.com/us/app/trueline-bowling-ball-tracker/id6801953797" target="_blank" rel="noreferrer">TrueLine</a>
        <a href="https://doi.org/10.3390/math12050741" target="_blank" rel="noreferrer">Paper</a>
      </nav>

      <div class="foot">
        <span class="hint">Scroll</span>
      </div>
    </main>

    <script type="module" src="/src/look/main.ts"></script>
  </body>
</html>
